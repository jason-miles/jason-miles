<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 268" width="1200" height="268" role="img" aria-label="Jason Miles — Senior Solutions Architect at Databricks">
  <title>Jason Miles — Senior Solutions Architect · Databricks</title>

  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; }
    .line  { stroke: #d0d7de; }
    .txt   { fill: #1f2328; }
    .muted { fill: #59636e; }
    .dot   { fill: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; }
      .line  { stroke: #30363d; }
      .txt   { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .dot   { fill: #30363d; }
    }
    
    .name  { font-weight: 800; letter-spacing: -0.5px; }
    .type  { fill: #e6edf3; }
    @media (prefers-color-scheme: light) { .type { fill: #1f2328; } }
  
  </style>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3621"/>
      <stop offset="55%" stop-color="#FF5F46"/>
      <stop offset="100%" stop-color="#FFA600"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FF3621" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF3621" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13.0" cy="13.0" r="1.1" class="dot" opacity="0.5"/></pattern>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="1198" height="266" rx="14" class="bg line" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="264" rx="13" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="266" rx="14" fill="url(#glow)"/>
  <!-- accent rail -->
  <rect x="1" y="1" width="7" height="266" rx="3.5" fill="url(#accent)"/>
  <!-- animated accent sweep along the top -->
  <rect x="56" y="46" width="120" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;340;0" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <!-- identity -->
  <text x="56" y="112" class="txt name" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'" font-size="60">Jason Miles</text>
  <text x="56" y="146" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'" font-size="21" letter-spacing="0.3px">Senior Solutions Architect · Databricks</text>

  <!-- rotating typed line -->
  <defs><clipPath id="clip0"><rect x="82" y="148" width="0" height="42"><animate attributeName="width" values="0;0;697;697" keyTimes="0;0.0000;0.1103;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="clip1"><rect x="82" y="148" width="0" height="42"><animate attributeName="width" values="0;0;713;713" keyTimes="0;0.2500;0.3603;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="clip2"><rect x="82" y="148" width="0" height="42"><animate attributeName="width" values="0;0;599;599" keyTimes="0;0.5000;0.6103;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="clip3"><rect x="82" y="148" width="0" height="42"><animate attributeName="width" values="0;0;616;616" keyTimes="0;0.7500;0.8603;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath></defs><text x="56" y="178" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" fill="#FF3621" font-weight="700">&#8250;</text><g id="g0"><g clip-path="url(#clip0)"><text x="82" y="178" class="type" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27">Turning data &amp; AI ambition into production.</text></g></g><animate xlink:href="#g0" attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.0000;0.2460;0.2500;1" dur="13.6s" repeatCount="indefinite"/><g id="g1"><g clip-path="url(#clip1)"><text x="82" y="178" class="type" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27">Lakehouse architecture · governance · GenAI.</text></g></g><animate xlink:href="#g1" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2460;0.2500;0.4960;0.5000;1" dur="13.6s" repeatCount="indefinite"/><g id="g2"><g clip-path="url(#clip2)"><text x="82" y="178" class="type" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27">From POC to production on Databricks.</text></g></g><animate xlink:href="#g2" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4960;0.5000;0.7460;0.7500;1" dur="13.6s" repeatCount="indefinite"/><g id="g3"><g clip-path="url(#clip3)"><text x="82" y="178" class="type" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27">Agents, RAG &amp; Model Serving, at scale.</text></g></g><animate xlink:href="#g3" attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.7460;0.7500;0.9960;1.0000;1" dur="13.6s" repeatCount="indefinite"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0000;0.2460;0.2500;1" dur="13.6s" repeatCount="indefinite"/><rect y="154" width="3" height="30" fill="#FF3621"><animate attributeName="x" values="82;82;779;779" keyTimes="0;0.0000;0.1103;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/></rect></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2460;0.2500;0.4960;0.5000;1" dur="13.6s" repeatCount="indefinite"/><rect y="154" width="3" height="30" fill="#FF3621"><animate attributeName="x" values="82;82;795;795" keyTimes="0;0.2500;0.3603;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/></rect></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4960;0.5000;0.7460;0.7500;1" dur="13.6s" repeatCount="indefinite"/><rect y="154" width="3" height="30" fill="#FF3621"><animate attributeName="x" values="82;82;681;681" keyTimes="0;0.5000;0.6103;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/></rect></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7460;0.7500;0.9960;1.0000;1" dur="13.6s" repeatCount="indefinite"/><rect y="154" width="3" height="30" fill="#FF3621"><animate attributeName="x" values="82;82;698;698" keyTimes="0;0.7500;0.8603;1" dur="13.6s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/></rect></g>

  <!-- live stat line -->
  <circle cx="60" cy="226" r="4.5" fill="#FF3621">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="231" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'" font-size="16">25 public repositories  ·  8 Databricks certifications  ·  London → UK · EMEA · South Africa</text>
